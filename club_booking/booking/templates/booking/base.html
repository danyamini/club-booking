<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>{% block title %}Компьютерный клуб{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Roboto', sans-serif;
    font-weight: 400;
    background-color: #121212;
    color: #ffffff;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

header {
    width: 100%;
    background-color: #1f1f1f;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
}

nav {
    display: flex;
    justify-content: center;
    padding: 15px 0;
    flex-wrap: wrap;
}

nav a {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 150px;
    height: 50px;
    margin: 5px;
    border-radius: 5px;
    color: #ffffff;
    text-decoration: none;
    font-weight: 500;
    font-size: 1.2rem;
    line-height: 1;
    border: 2px solid #009688;
    background-color: #009688;
    transition: box-shadow 0.3s;
}

nav a:hover {
    box-shadow: 0 0 15px rgba(0,150,136,0.7);
}

main {
    flex: 1;
    width: 90%;
    max-width: 1200px;
    padding: 30px;
    box-sizing: border-box;
}

h2, h3 {
    font-weight: 500;
    margin-bottom: 15px;
    color: #ffffff;
}

input, select, button {
    font-family: 'Roboto', sans-serif;
    font-weight: 500;
    font-size: 1rem;
}

button {
    cursor: pointer;
    transition: box-shadow 0.3s;
    padding: 12px 24px;
    font-size: 1.2rem;
    border-radius: 5px;
    border: none;
    background-color: #2c2c2c;
    color: #ffffff;
}

button:hover {
    box-shadow: 0 0 12px rgba(0,150,136,0.6);
}

input, select {
    background-color: #1e1e1e;
    border: 1px solid #555555;
    color: #ffffff;
    padding: 10px;
    border-radius: 5px;
}

input::placeholder {
    color: #bbbbbb;
}

.booking-info, #booking-summary {
    background-color: #1e1e1e;
    border: 1px solid #009688;
    border-radius: 8px;
    padding: 15px;
    margin-top: 20px;
}
</style>
</head>
<body>
<header>
<nav>
    <a href="{% url 'main' %}">Главная</a>
    <a href="{% url 'booking' %}">Бронирование</a>
    <a href="{% url 'reviews' %}">Отзывы</a> <!-- Кнопка отзывы -->
    {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">Профиль</a>
    {% else %}
        <a href="{% url 'login' %}">Войти</a>
    {% endif %}
</nav>
</header>

<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
