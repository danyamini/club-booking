{% extends 'booking/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<style>
form {
    max-width: 400px;
    margin: 0 auto;
    padding: 25px;
    background-color: #1e1e1e;
    border: 1px solid #009688;
    border-radius: 10px;
    box-sizing: border-box;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 500;
}

form input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 5px;
    border: 1px solid #555555;
    background-color: #121212;
    color: #ffffff;
    font-size: 1rem;
}

form input::placeholder {
    color: #bbbbbb;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    font-size: 1.2rem;
    border-radius: 5px;
    border: 2px solid #009688;
    background-color: #009688;
    color: #ffffff;
    cursor: pointer;
    transition: box-shadow 0.3s, transform 0.1s;
}

button:hover {
    box-shadow: 0 0 12px rgba(0,150,136,0.6);
    transform: scale(1.03);
}

p {
    text-align: center;
    margin-top: 15px;
}

p a {
    color: #00e5ff;
    text-decoration: none;
    transition: color 0.2s;
}

p a:hover {
    color: #a0ffd4;
}
</style>

<h1>Вход в систему</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Войти</button>
</form>

<p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
{% endblock %}
