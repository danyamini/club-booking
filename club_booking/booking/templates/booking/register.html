{% extends 'booking/base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<style>
h1 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 500;
}

form {
    max-width: 500px;
    margin: 0 auto;
    text-align: center;
}

input, select {
    width: 90%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 5px;
    border: 1px solid #555555;
    background-color: #1e1e1e;
    color: #ffffff;
    font-family: 'Roboto', sans-serif;
    font-weight: 400;
}

input::placeholder {
    color: #bbbbbb;
}

button {
    padding: 12px 24px;
    margin-top: 10px;
    border-radius: 5px;
    border: none;
    background-color: #009688;
    color: #ffffff;
    font-size: 1rem;
    cursor: pointer;
    transition: box-shadow 0.3s;
}

button:hover {
    box-shadow: 0 0 12px rgba(0,150,136,0.6);
}

p {
    text-align: center;
    margin-top: 15px;
}

a {
    color: #00e5ff;
    text-decoration: none;
    transition: color 0.2s;
}

a:hover {
    color: #a0ffd4;
}
</style>

<h1>Регистрация нового пользователя</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Зарегистрироваться</button>
</form>
<p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
{% endblock %}
